services:
  ddc-backend-api:
    platform: linux/arm64/v8
    build: .                # 用本地 Dockerfile 构建镜像
    ports:
      - "127.0.0.1:10000:3000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src      # 挂载本地 src 目录到容器
      - ./prisma:/app/prisma
      - ./keys:/app/keys
      - ./scripts:/app/scripts
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./config:/app/config
    command: npm run dev  # 使用 nodemon 启动，使代码更新无需重建镜像即可生效
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 允许容器访问主机服务
    restart: always
    # 注意：如果使用外部数据库（如 datadance-postgres），
    # 需要在 .env 中配置 DATABASE_URL 指向 host.docker.internal:5432

